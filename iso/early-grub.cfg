# Embedded inside the GRUB EFI binary by grub-mkimage.
#
# This is the only configuration GRUB has before it has found anything, and it
# exists to answer one question: which of the devices the firmware handed us is
# the one this bootloader came from?
#
# It cannot be assumed. When the ISO is booted as a disc, GRUB starts from the
# El Torito EFI image -- a FAT filesystem that contains the bootloader and
# nothing else, so a relative prefix would point at an empty partition. When
# the same bytes are written to a USB stick, GRUB starts from the appended EFI
# system partition, with the same problem. In both cases the real content is on
# a *different* device, and the marker file is how it is recognised.

search --no-floppy --set=root --file /duct/.duct-live

# Both, and in this order. prefix is where GRUB looks for modules it has not
# already got embedded; configfile is the menu. Setting prefix after loading
# the menu would be too late for anything the menu needs.
set prefix=($root)/boot/grub
configfile ($root)/boot/grub/grub.cfg

# Reached only if the search found nothing or the menu is missing. GRUB drops
# to its own prompt after this, which is a far better place to be than a blank
# screen -- `ls` there will show which devices the firmware did offer.
echo "duct-live: no medium with /duct/.duct-live was found."
echo "duct-live: falling back to the GRUB prompt."
