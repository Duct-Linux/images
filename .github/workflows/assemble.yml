name: assemble images

# Builds duct/base and duct/builder by installing from the published repository
# at repo.duct.dss-net.de, and pushes them to GHCR.
#
# Assembly is downloading and unpacking rather than compiling, so this takes
# about a minute per architecture -- unlike the bootstrap, which builds a
# toolchain from nothing and takes an hour.
#
# Building this way makes the images a test of the repository: the build fetches
# the same index, verifies the same signature against the same public key and
# checks the same digests a user's machine would. A broken publish fails here
# rather than on someone's first `tape install`.

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to GHCR'
        type: boolean
        default: true
  # Duct-Linux/packages can trigger this after a successful publish:
  #   gh api repos/Duct-Linux/images/dispatches -f event_type=repository-published
  # which needs a PAT with repo scope stored there, since GITHUB_TOKEN cannot
  # dispatch across repositories.
  repository_dispatch:
    types: [repository-published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/duct-linux
  REPO_URL: https://repo.duct.dss-net.de

  # What each image is. tape resolves dependencies itself, so these could be
  # shorter -- listing them makes the contents a reviewable decision rather than
  # a consequence of whatever some recipe happens to depend on.
  BASE_PACKAGES: >-
    duct-filesystem linux-headers glibc zlib gmp mpfr mpc
    binutils gcc ncurses bash uutils-coreutils tape
  BUILDER_EXTRA: >-
    m4 bison flex make gawk sed grep findutils diffutils
    tar gzip xz bzip2 patch file pkgconf perl texinfo python gettext

jobs:
  assemble:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64  }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      # An architecture exists only once its bootstrap has published one.
      # Skipping is the correct response, not failing: until the x86_64
      # bootstrap has run there is nothing to assemble from, and that is a known
      # state rather than an error.
      - id: have
        run: |
          if docker manifest inspect "$REGISTRY/bootstrap:${{ matrix.arch }}" >/dev/null 2>&1; then
            echo "yes=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::no bootstrap image for ${{ matrix.arch }}; skipping"
            echo "yes=false" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.have.outputs.yes == 'true'
        with: { path: images }
      # Only for server/duct.key.pub, the trust anchor. Taken from the packages
      # repo rather than copied here so there is one source of truth for it.
      - uses: actions/checkout@v4
        if: steps.have.outputs.yes == 'true'
        with: { repository: Duct-Linux/packages, path: packages }

      - uses: docker/login-action@v3
        if: steps.have.outputs.yes == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail early and legibly. The image build would fail anyway, but twenty
      # lines into a daemon log.
      - name: Check the repository is serving
        if: steps.have.outputs.yes == 'true'
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null "$REPO_URL/repo.db"
          curl -fsS -o /dev/null "$REPO_URL/repo.db.sig"
          echo "repository is serving an index and a signature"

      - name: Assemble
        if: steps.have.outputs.yes == 'true'
        run: |
          set -euo pipefail
          docker build -f images/Dockerfile.base \
            --build-arg BOOTSTRAP="$REGISTRY/bootstrap:${{ matrix.arch }}" \
            --build-arg REPO_URL="$REPO_URL" \
            --build-arg PACKAGES="$BASE_PACKAGES" \
            --build-arg IMAGE_TITLE="Duct base" \
            -t "$REGISTRY/base:${{ matrix.arch }}" .
          docker build -f images/Dockerfile.base \
            --build-arg BOOTSTRAP="$REGISTRY/bootstrap:${{ matrix.arch }}" \
            --build-arg REPO_URL="$REPO_URL" \
            --build-arg PACKAGES="$BASE_PACKAGES $BUILDER_EXTRA" \
            --build-arg IMAGE_TITLE="Duct builder" \
            --build-arg IMAGE_DESCRIPTION="Duct system with a full build toolchain" \
            -t "$REGISTRY/builder:${{ matrix.arch }}" .

      - name: Test
        if: steps.have.outputs.yes == 'true'
        run: |
          set -euo pipefail
          docker run --rm "$REGISTRY/base:${{ matrix.arch }}" /usr/bin/bash -c '
            gcc --version | head -1
            echo "int main(void){return 0;}" >/tmp/t.c && gcc /tmp/t.c -o /tmp/t && /tmp/t
            ls --version | head -1'
          # duct/builder must be able to build a package, which is its entire
          # purpose -- and python and gettext must be present, without which
          # glibc cannot be rebuilt and its contents change silently.
          docker run --rm "$REGISTRY/builder:${{ matrix.arch }}" /usr/bin/bash -c '
            make --version | head -1; python3 --version; msgfmt --version | head -1'

      - name: Push
        if: steps.have.outputs.yes == 'true' && (github.event_name == 'repository_dispatch' || inputs.push)
        run: |
          docker push "$REGISTRY/base:${{ matrix.arch }}"
          docker push "$REGISTRY/builder:${{ matrix.arch }}"

  # Assembled from whichever architecture tags exist, so :latest is correct with
  # one architecture and becomes multi-arch by itself when the second lands.
  manifest:
    needs: assemble
    if: github.event_name == 'repository_dispatch' || inputs.push
    runs-on: ubuntu-latest
    permissions: { packages: write }
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          for img in base builder; do
            tags=()
            for a in x86_64 aarch64; do
              docker manifest inspect "$REGISTRY/$img:$a" >/dev/null 2>&1 && tags+=("$REGISTRY/$img:$a")
            done
            [ ${#tags[@]} -gt 0 ] || { echo "::error::no architecture tags for $img"; exit 1; }
            docker buildx imagetools create -t "$REGISTRY/$img:latest" "${tags[@]}"
            docker buildx imagetools inspect "$REGISTRY/$img:latest"
          done
